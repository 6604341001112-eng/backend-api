<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการสินค้า | AI Stock</title>

<!-- สคริปต์ตรวจสิทธิ์: อนุญาตเฉพาะ Admin เท่านั้น -->
<script>
  (function checkAdminAuth() {
    const username = sessionStorage.getItem('username');
    const role = (sessionStorage.getItem('userRole') || '').toLowerCase();

    if (!username) {
      alert('กรุณาเข้าสู่ระบบก่อนใช้งาน');
      window.location.href = 'login.html';
      return;
    }

    if (role !== 'admin' && username.toLowerCase() !== 'admin') {
      alert('⛔ สิทธิ์การใช้งานของคุณ (Owner) ไม่สามารถเข้าถึงหน้าจัดการสินค้าได้');
      window.location.href = 'dashboard.html';
    }
  })();
</script>

<style>
  :root {
    --navy: #0F172A; --blue: #2563EB; --blue-light: #EFF6FF;
    --gray-bg: #F1F5F9; --gray-line: #E2E8F0; --gray-mid: #94A3B8; --gray-text: #475569;
    --ink: #0F172A; --white: #FFFFFF; --amber: #D97706; --red: #DC2626;
    --font: "Segoe UI", "Leelawadee UI", "Sarabun", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--gray-bg); color: var(--ink); }

  .shell { display: flex; min-height: 100vh; }
  
  /* Sidebar */
  .sidebar { width: 210px; background: var(--navy); color: #CBD5E1; flex-shrink: 0; padding: 22px 0; }
  .sidebar .logo { padding: 0 20px 20px; color: #fff; font-weight: 700; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 14px; line-height: 1.4; }
  .sidebar .logo span { display: block; font-size: 11px; font-weight: 400; color: var(--gray-mid); margin-top: 3px; }
  
  .nav-item { 
    padding: 11px 20px; 
    font-size: 13.5px; 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    border-left: 3px solid transparent; 
    color: #94A3B8; 
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; flex-shrink: 0; }
  .nav-item.on { background: rgba(37, 99, 235, .15); color: #fff; border-left-color: var(--blue); font-weight: 600; }
  .nav-item.on .dot { background: var(--blue); }

  /* Main Content Layout */
  .main { flex: 1; min-width: 0; }
  .topbar { background: #fff; border-bottom: 1px solid var(--gray-line); padding: 14px 26px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .topbar h1 { font-size: 16px; font-weight: 700; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .user-badge { font-size: 13px; font-weight: 600; color: var(--gray-text); background: var(--gray-bg); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--gray-line); }

  .content { padding: 22px; }

  /* Buttons */
  .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-family: var(--font); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .2s; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-blue:hover { background: #1D4ED8; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: #B91C1C; }
  .btn-edit { background: #EAB308; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 4px; font-weight: 600; }
  .btn-delete { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }

  /* Table Card */
  .panel { background: #fff; border: 1px solid var(--gray-line); border-radius: 12px; padding: 20px; }
  
  /* Filter & Search Toolbar (เพิ่มเติม) */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
  .toolbar-left { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 280px; }
  .search-input, .select-filter { padding: 8px 12px; border: 1px solid var(--gray-line); border-radius: 8px; font-size: 13px; font-family: var(--font); outline: none; background: #fff; }
  .search-input { flex: 1; min-width: 200px; }
  .search-input:focus, .select-filter:focus { border-color: var(--blue); }

  /* Pagination Bar (เพิ่มเติม) */
  .pagination-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; flex-wrap: wrap; gap: 10px; font-size: 12.5px; color: var(--gray-text); }
  .pagination-controls { display: flex; gap: 4px; align-items: center; }
  .page-btn { padding: 6px 12px; border: 1px solid var(--gray-line); background: #fff; border-radius: 6px; cursor: pointer; font-size: 12.5px; color: var(--ink); font-weight: 600; transition: all 0.15s; }
  .page-btn:hover:not(:disabled) { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }
  .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .page-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th { text-align: left; color: var(--gray-text); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; padding: 10px 12px; border-bottom: 1px solid var(--gray-line); background: #FAFBFC; }
  tbody td { padding: 12px; border-bottom: 1px solid #F1F5F9; }
  tbody tr:hover { background: var(--blue-light); }

  /* Modal Popup */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.5);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal { background: white; border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; }
  .modal h3 { margin-bottom: 16px; color: var(--navy); font-size: 16px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; color: var(--gray-text); }
  .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid var(--gray-line); border-radius: 8px; font-size: 13px; font-family: var(--font); outline: none; }

  .alert-error {
    background-color: #fef2f2; border: 1px solid #fca5a5; color: var(--red);
    padding: 10px 14px; border-radius: 6px; font-size: 12.5px; margin-bottom: 14px; display: none; font-weight: 600;
  }

  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn-cancel { background: var(--gray-mid); color: white; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; }

  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="logo">AI Stock<span>Sales Forecasting System</span></div>
    <a href="dashboard.html" class="nav-item"><span class="dot"></span>Dashboard</a>
    <a href="product.html" class="nav-item on"><span class="dot"></span>จัดการสินค้า</a>
    <a href="categories.html" class="nav-item"><span class="dot"></span>หมวดหมู่สินค้า</a>
    <a href="sales.html" class="nav-item"><span class="dot"></span>การขาย</a>
    <a href="forecast.html" class="nav-item"><span class="dot"></span>พยากรณ์ยอดขายด้วย AI</a>
  </div>

  <div class="main">
    <div class="topbar">
      <h1>📦 จัดการสินค้า (Product Management)</h1>
      <div class="controls">
        <span id="userDisplay" class="user-badge">👤 ผู้ใช้: -</span>
        <button onclick="openModal()" class="btn btn-blue">+ เพิ่มสินค้าใหม่</button>
        <button onclick="logout()" class="btn btn-red">🚪 ออกจากระบบ</button>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        
        <!-- 🔍 แถบค้นหาและตัวกรองหมวดหมู่ -->
        <div class="toolbar">
          <div class="toolbar-left">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อ หรือ รหัสสินค้า..." oninput="onFilterChange()">
            <select id="categoryFilter" class="select-filter" onchange="onFilterChange()">
              <option value="">ทุกหมวดหมู่สินค้า</option>
            </select>
          </div>
          <div>
            <select id="pageSizeSelect" class="select-filter" onchange="onPageSizeChange(this.value)">
              <option value="10">10 รายการ / หน้า</option>
              <option value="25">25 รายการ / หน้า</option>
              <option value="50">50 รายการ / หน้า</option>
              <option value="100">100 รายการ / หน้า</option>
            </select>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th>รหัสสินค้า</th>
              <th>ชื่อสินค้า</th>
              <th>หมวดหมู่</th>
              <th>ราคา (บาท)</th>
              <th>สต็อก</th>
              <th>การจัดการ</th>
            </tr>
          </thead>
          <tbody id="productTableBody">
          </tbody>
        </table>

        <!-- 📄 ตัวควบคุมการแบ่งหน้า (Pagination) -->
        <div class="pagination-bar">
          <span id="pageInfoText">แสดง 0 - 0 จาก 0 รายการ</span>
          <div class="pagination-controls" id="paginationButtons">
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="productModal" class="modal-overlay">
  <div class="modal">
    <h3 id="modalTitle">เพิ่มสินค้าใหม่</h3>
    <div id="alertError" class="alert-error"></div>

    <form id="productForm" onsubmit="handleSaveProduct(event)">
      <input type="hidden" id="editIndex" value="-1">
      
      <div class="form-group">
        <label for="pName">ชื่อสินค้า *</label>
        <input type="text" id="pName" placeholder="เช่น กาแฟอเมริกาโน่" required>
      </div>

      <div class="form-group">
        <label for="pCategory">หมวดหมู่</label>
        <select id="pCategory">
          <option value="">กำลังโหลดหมวดหมู่...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pPrice">ราคาขาย (บาท) *</label>
        <input type="number" id="pPrice" step="any" placeholder="ระบุราคา" min="0" required>
      </div>

      <div class="form-group">
        <label for="pStock">สต็อกเริ่มต้น (ชิ้น) *</label>
        <input type="number" id="pStock" placeholder="ระบุจำนวนสต็อก" min="0" required>
      </div>

      <div class="modal-actions">
        <button type="button" onclick="closeModal()" class="btn-cancel">ยกเลิก</button>
        <button type="submit" class="btn btn-blue">บันทึกข้อมูล</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE_URL = '/api/products'; 

  // ตัวแปรส่วนกลางสำหรับจัดการค้นหาและ Pagination
  let ALL_PRODUCTS = [];
  let FILTERED_PRODUCTS = [];
  let CATEGORY_LIST = [];
  let currentPage = 1;
  let pageSize = 10;

  document.getElementById('userDisplay').innerText = '👤 ผู้ใช้งาน: ' + (sessionStorage.getItem('username') || 'Guest');

  function logout() {
    sessionStorage.clear();
    window.location.href = 'login.html';
  }

  // 📌 0. ดึงหมวดหมู่จริงจาก /api/categories มาใส่ใน dropdown ทั้ง Modal และ Filter
  async function loadCategories() {
    try {
      const res = await fetch('/api/categories');
      const categories = await res.json();
      CATEGORY_LIST = Array.isArray(categories) ? categories : (categories.data || []);
      
      // ตัวเลือกหมวดหมู่ใน Modal
      const modalSelect = document.getElementById('pCategory');
      modalSelect.innerHTML = CATEGORY_LIST.map(c =>
        `<option value="${c.category_id}">${c.category_name}</option>`
      ).join('') || '<option value="">ไม่พบหมวดหมู่ (โปรดเพิ่มในหน้าหมวดหมู่สินค้า)</option>';

      // ตัวเลือกหมวดหมู่ใน Filter
      const filterSelect = document.getElementById('categoryFilter');
      filterSelect.innerHTML = '<option value="">ทุกหมวดหมู่สินค้า</option>' + 
        CATEGORY_LIST.map(c => `<option value="${c.category_name}">${c.category_name}</option>`).join('');

    } catch (err) {
      console.error('โหลดหมวดหมู่ไม่สำเร็จ:', err);
      document.getElementById('pCategory').innerHTML = '<option value="">โหลดหมวดหมู่ไม่สำเร็จ</option>';
    }
  }

  // 📌 1. ดึงข้อมูลสินค้าจาก API
  async function getProducts() {
    try {
      const response = await fetch(API_BASE_URL, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      });

      if (!response.ok) {
        throw new Error(`HTTP status: ${response.status}`);
      }
      
      const data = await response.json();
      return Array.isArray(data) ? data : (data.data || []);
    } catch (error) {
      console.error('Error fetching product_data:', error);
      return null;
    }
  }

  // 📌 2. แสดงผลข้อมูลลงตาราง (พร้อมระบบ กรอง และ Pagination)
  async function renderTable() {
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">⏳ กำลังโหลดข้อมูล...</td></tr>';

    ALL_PRODUCTS = await getProducts();

    if (ALL_PRODUCTS === null) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--red);">⚠️ ไม่สามารถดึงข้อมูลได้ (โปรดตรวจสอบ Route /api/products ฝั่ง Express)</td></tr>';
      updatePaginationControls(0, 0, 0);
      return;
    }

    applyFilterAndRender();
  }

  // ฟังก์ชันกรองข้อมูล และ คำนวณการแสดงผลตามหน้า
  function applyFilterAndRender() {
    const tbody = document.getElementById('productTableBody');
    const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const selectedCategory = document.getElementById('categoryFilter').value;

    // กรองข้อมูลตามคำค้นหา และ หมวดหมู่
    FILTERED_PRODUCTS = ALL_PRODUCTS.filter(p => {
      const productId = String(p.product_id || p.id || '');
      const productCode = String(p.code || p.product_code || (productId ? `PRD-${productId.padStart(3, '0')}` : '')).toLowerCase();
      const productName = String(p.product_name || p.name || '').toLowerCase();
      const category = String(p.category_name || p.category || 'ทั่วไป');

      const matchesSearch = productName.includes(searchKeyword) || productCode.includes(searchKeyword);
      const matchesCategory = selectedCategory === '' || category === selectedCategory;

      return matchesSearch && matchesCategory;
    });

    if (FILTERED_PRODUCTS.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ไม่พบข้อมูลสินค้าที่ค้นหา</td></tr>';
      updatePaginationControls(0, 0, 0);
      return;
    }

    // คำนวณข้อมูลตาม Pagination
    const totalItems = FILTERED_PRODUCTS.length;
    const totalPages = Math.ceil(totalItems / pageSize) || 1;
    
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = Math.min(startIndex + pageSize, totalItems);
    const paginatedItems = FILTERED_PRODUCTS.slice(startIndex, endIndex);

    // แสดงรายการสินค้า
    tbody.innerHTML = '';
    paginatedItems.forEach((p) => {
      const productId = p.product_id || p.id;
      const productCode = p.code || p.product_code || (productId ? `PRD-${String(productId).padStart(3, '0')}` : '-');
      const productName = p.product_name || p.name || 'ไม่ระบุชื่อสินค้า';
      const category = p.category_name || p.category || 'ทั่วไป';
      const price = Number(p.unit_price || p.price || 0);
      const stock = Number(p.stock || p.stock_quantity || p.quantity || 0);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${productCode}</strong></td>
        <td>${productName}</td>
        <td>${category}</td>
        <td>${price.toFixed(2)}</td>
        <td>${stock} ชิ้น</td>
        <td>
          <button onclick="editProduct('${productId}')" class="btn-edit">แก้ไข</button>
          <button onclick="deleteProduct('${productId}')" class="btn-delete">ลบ</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    updatePaginationControls(startIndex + 1, endIndex, totalItems);
  }

  // อัปเดตปุ่ม Pagination และ ข้อความระบุจำนวน
  function updatePaginationControls(startRow, endRow, totalRows) {
    const infoText = document.getElementById('pageInfoText');
    const navBtns = document.getElementById('paginationButtons');

    if (totalRows === 0) {
      infoText.innerText = 'แสดง 0 - 0 จาก 0 รายการ';
      navBtns.innerHTML = '';
      return;
    }

    infoText.innerText = `แสดง ${startRow} - ${endRow} จาก ${totalRows} รายการ`;

    const totalPages = Math.ceil(totalRows / pageSize);
    let buttonsHtml = `<button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>❮ ก่อนหน้า</button>`;

    for (let i = 1; i <= totalPages; i++) {
      // แสดงเฉพาะหน้าที่ใกล้เคียงเพื่อประหยัดพื้นที่ถ้าหน้าเยอะ
      if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        buttonsHtml += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        buttonsHtml += `<span style="padding: 0 4px; color: var(--gray-mid);">...</span>`;
      }
    }

    buttonsHtml += `<button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>ถัดไป ❯</button>`;
    navBtns.innerHTML = buttonsHtml;
  }

  // เปลี่ยนหน้า
  function changePage(page) {
    currentPage = page;
    applyFilterAndRender();
  }

  // เมื่อมีการพิมพ์ค้นหาหรือเลือกหมวดหมู่
  function onFilterChange() {
    currentPage = 1; // รีเซ็ตกลับไปหน้าแรกเสมอเมื่อค้นหา
    applyFilterAndRender();
  }

  // เมื่อเปลี่ยนจำนวนรายการต่อหน้า
  function onPageSizeChange(newSize) {
    pageSize = parseInt(newSize);
    currentPage = 1;
    applyFilterAndRender();
  }

  function openModal() {
    document.getElementById('modalTitle').innerText = 'เพิ่มสินค้าใหม่';
    document.getElementById('productForm').reset();
    document.getElementById('editIndex').value = '-1';
    hideError();
    document.getElementById('productModal').style.display = 'flex';
  }

  // 📌 3. ดึงข้อมูลสินค้ารายชิ้น
  async function editProduct(id) {
    try {
      const response = await fetch(`${API_BASE_URL}/${id}`);
      if (!response.ok) throw new Error('ไม่พบข้อมูลสินค้ารายการนี้');
      const res = await response.json();
      const p = res.data || res;

      document.getElementById('modalTitle').innerText = 'แก้ไขสินค้า ID: ' + id;
      document.getElementById('pName').value = p.product_name || p.name || '';
      document.getElementById('pCategory').value = p.category_id || '';
      document.getElementById('pPrice').value = p.unit_price || p.price || 0;
      document.getElementById('pStock').value = p.stock || p.stock_quantity || p.quantity || 0;
      document.getElementById('editIndex').value = id;
      hideError();
      document.getElementById('productModal').style.display = 'flex';
    } catch (error) {
      alert('เกิดข้อผิดพลาดในการดึงข้อมูลสินค้า: ' + error.message);
    }
  }

  function closeModal() {
    document.getElementById('productModal').style.display = 'none';
  }

  function showError(msg) {
    const alertBox = document.getElementById('alertError');
    alertBox.innerText = '⚠️ ' + msg;
    alertBox.style.display = 'block';
  }

  function hideError() {
    document.getElementById('alertError').style.display = 'none';
  }

  // 📌 4. บันทึกข้อมูลสินค้า
  async function handleSaveProduct(e) {
    e.preventDefault();
    hideError();

    const productName = document.getElementById('pName').value.trim();
    const categoryId = parseInt(document.getElementById('pCategory').value) || null;
    const price = parseFloat(document.getElementById('pPrice').value);
    const stock = parseInt(document.getElementById('pStock').value);
    const id = document.getElementById('editIndex').value;

    if (isNaN(price) || price < 0) {
      showError('ราคาสินค้าต้องไม่ติดลบ');
      return;
    }

    if (isNaN(stock) || stock < 0) {
      showError('จำนวนสต็อกต้องไม่ติดลบ');
      return;
    }

    if (!categoryId) {
      showError('กรุณาเลือกหมวดหมู่สินค้า');
      return;
    }

    const payload = { 
      product_name: productName,
      name: productName,
      category_id: categoryId,
      unit_price: price,
      price: price, 
      stock: stock,
      stock_quantity: stock
    };

    try {
      const isNew = id === '-1';
      const url = isNew ? API_BASE_URL : `${API_BASE_URL}/${id}`;
      const method = isNew ? 'POST' : 'PUT';

      const response = await fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) throw new Error('ไม่สามารถบันทึกข้อมูลได้');

      await renderTable();
      closeModal();
    } catch (error) {
      showError('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
    }
  }

  // 📌 5. ลบสินค้า
  async function deleteProduct(id) {
    if (confirm(`คุณต้องการลบสินค้า ID ${id} ใช่หรือไม่?`)) {
      try {
        const response = await fetch(`${API_BASE_URL}/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('ลบข้อมูลไม่สำเร็จ');

        renderTable();
      } catch (error) {
        alert('เกิดข้อผิดพลาดในการลบข้อมูล: ' + error.message);
      }
    }
  }

  loadCategories();
  renderTable();
</script>
</body>
